# Render Blueprint: one free web service runs the API and serves the website, from one HTTPS address.
# Render → New → Blueprint → choose this repository. Render asks once for every value marked
# `sync: false`; those are secrets or addresses and never belong in Git. JWT_SECRET is generated.
# Every push to the branch below redeploys automatically; earlier deploys can be rolled back in Render.
services:
  - type: web
    name: vidyadaan
    runtime: node
    plan: free
    region: singapore
    branch: backend
    # Dev tools (Vite, Tailwind) are needed to build the website, so they are installed for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/test
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render runs the app behind its own proxy (real visitor IPs for rate limits, secure cookies).
      - key: TRUST_PROXY
        value: "1"
      # The test database (a dev tool) would otherwise download MongoDB during every build.
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      # This service's own address, e.g. https://vidyadaan.onrender.com (for email links and CORS).
      - key: FRONTEND_ORIGIN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Read while building the website, so set it before the first deploy (or redeploy after setting it).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
